name: Build and deploy to GitHub Pages

# GitHub Pages does NOT run `npm run build` — it serves files as-is. Because
# this repo's index.html points at /src/main.tsx (TypeScript, which browsers
# cannot execute), serving the raw source produces a blank white page.
#
# This workflow builds the site properly and publishes the result, so the
# live URL shows the real website.

on:
  push:
    branches:
      - main
      - arena/01a0fc86-hmcn
  workflow_dispatch:

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-progress one, but never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and run smoke tests
        run: npm run verify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # VITE_BASE must match the subpath GitHub Pages serves from
      # (https://<user>.github.io/HMCN/). When you move to a custom domain,
      # change this to "/".
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /HMCN/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
