    <!-- Schema.org LocalBusiness -->
    <!-- NOTE: aggregateRating was removed on purpose. Inventing a rating /

    <script type="application/ld+json">

    <!-- Meta Pixel Code — GDPR/CCPA COMPLIANT VERSION -->
    <!-- The pixel is loaded but NOT activated until the visitor clicks
         "Accept All Cookies". The previous version fired fbq('init') and
         fbq('track','PageView') on page load, which sent data to Facebook
         BEFORE consent was given — making the cookie banner pointless.
         To enable ad tracking: edit src/utils/pixel.ts -->
  </head>
  <body>
    <div id="root"></div>
    <!-- NOTE: the Meta Pixel <noscript> beacon was removed on purpose.
         It fired a PageView for visitors with JavaScript disabled, who can
         never see the cookie banner and therefore can never consent. The
         pixel now only ever loads through src/utils/pixel.ts, after consent. -->
    <noscript>
